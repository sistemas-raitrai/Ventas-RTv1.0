<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha médica | Sistema Ventas RT</title>
  <link rel="stylesheet" href="ficha-medica.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar no-print">
      <div>
        <h1>Ficha médica individual</h1>
        <p id="pageSubtitle">Cargando pasajero...</p>
      </div>

      <div class="actions">
        <a id="btnVolver" class="button-link btn-light" href="#">Volver a gestión</a>
        <button id="btnPrint" class="btn-yellow" type="button">Descargar / imprimir PDF</button>
      </div>
    </header>

    <section id="loadingBox" class="loading">Cargando ficha...</section>
    <section id="errorBox" class="error-box hidden"></section>
    <section id="sheetContainer"></section>
  </main>

  <script type="module" src="ficha-medica.js"></script>
</body>
</html>
