<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buzón de correo | Sistema Ventas RT</title>
  <link rel="stylesheet" href="./estilos.css">
  <link rel="icon" type="image/png" href="./IMG/logo-raitrai.png">
  <style>
    .buzon-page { padding: 20px 30px 34px; }
    .buzon-panel {
      padding: 22px;
      border: 1px solid #d8d1df;
      border-radius: 22px;
      background: #f2f0f5;
    }
    .buzon-head, .buzon-linea {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 14px;
    }
    .buzon-head { justify-content: space-between; }
    .buzon-head h1 {
      margin: 0;
      color: var(--header, #281638);
      font-size: 30px;
    }
    .buzon-head p { margin: 5px 0 0; color: #6a6075; }
    .buzon-page [hidden] { display: none !important; }
    .buzon-aviso {
      margin: 14px 0 0;
      color: #59496b;
      overflow-wrap: anywhere;
    }
    .buzon-aviso.error { color: #99262e; }
    .buzon-seccion, .buzon-capa {
      min-width: 0;
      margin: 16px 0 0;
      padding: 16px;
      border: 1px solid #ddd4e5;
      border-radius: 15px;
      background: #fff;
    }
    .buzon-seccion h2 {
      margin: 0 0 12px;
      font-size: 19px;
      color: var(--header, #281638);
    }
    .buzon-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
    }
    .buzon-campo { display: grid; gap: 4px; min-width: 0; font-weight: 700; }
    .buzon-campo :is(input, select, textarea) {
      box-sizing: border-box;
      width: 100%;
      min-width: 0;
      min-height: 38px;
      padding: 7px 9px;
      border: 1px solid #d4c9de;
      border-radius: 9px;
      background: #fff;
      color: #261638;
      font: inherit;
      font-weight: 400;
    }
    .buzon-campo textarea { resize: vertical; }
    .buzon-page :is(button, .buzon-boton) {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 12px;
      border: 1px solid #d4c9de;
      border-radius: 10px;
      background: #fff;
      color: #4a2570;
      font: inherit;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }
    .buzon-page button.buzon-principal {
      border-color: #4a2570;
      background: #4a2570;
      color: #fff;
    }
    .buzon-page button:disabled { opacity: .55; cursor: default; }
    .buzon-espacio { margin-top: 12px; }
    .buzon-lista { max-height: 340px; overflow: auto; margin-top: 10px; }
    .buzon-fila {
      display: block;
      margin: 0;
      padding: 8px 4px;
      border-bottom: 1px solid #eee8f2;
      overflow-wrap: anywhere;
    }
    .buzon-ayuda { color: #6a6075; margin: 8px 0; }
    .buzon-capa legend { padding: 0 5px; font-weight: 750; color: #4a2570; }
    .buzon-vista {
      display: block;
      max-width: 100%;
      max-height: 600px;
      margin-top: 12px;
      border-radius: 10px;
    }
    @media (max-width: 650px) {
      .buzon-page, .buzon-panel, .buzon-seccion { padding: 14px; }
      .buzon-head h1 { font-size: 24px; }
    }
  </style>
</head>

<body class="ventas-body" data-page="buzon-correo">
  <div id="layout-top"></div>

  <main class="page-shell buzon-page">
    <section class="buzon-panel">
      <header class="buzon-head">
        <div>
          <h1>Buzón de correo</h1>
          <p>Comunicaciones de viaje y campañas de descuentos.</p>
        </div>
        <a class="buzon-boton" href="./gestion-nomina.html">Volver a Gestión de Nómina</a>
      </header>

      <p id="mensaje" class="buzon-aviso" role="status" aria-live="polite">Verificando sesión…</p>

      <div id="app" hidden>
        <section class="buzon-seccion">
          <h2>Grupos</h2>
          <div class="buzon-grid">
            <label class="buzon-campo">Año
              <input id="ano" type="number" min="2020" max="2100" value="2026">
            </label>
            <label class="buzon-campo">Destino
              <select id="destino"><option value="">Todos</option></select>
            </label>
            <label class="buzon-campo">Salida desde <input id="desde" type="date"></label>
            <label class="buzon-campo">Salida hasta <input id="hasta" type="date"></label>
            <label class="buzon-campo">Colegio, ID o negocio <input id="buscarGrupo" type="search"></label>
          </div>
          <div class="buzon-linea buzon-espacio">
            <button id="cargarGrupos" type="button">Cargar año</button>
            <button id="marcarGrupos" type="button">Marcar grupos visibles</button>
            <button id="limpiarGrupos" type="button">Limpiar selección</button>
          </div>
          <div id="grupos" class="buzon-lista"></div>
          <p id="resumenGrupos" class="buzon-ayuda"></p>
          <button id="cargarPersonas" type="button" class="buzon-principal">Cargar nóminas seleccionadas</button>
        </section>

        <section class="buzon-seccion">
          <h2>Destinatarios</h2>
          <div class="buzon-linea">
            <label><input id="estudiantes" type="checkbox" checked> Estudiantes</label>
            <label><input id="adultos" type="checkbox"> Adultos acompañantes</label>
            <label><input id="profesores" type="checkbox"> Profesores</label>
          </div>
          <div class="buzon-grid buzon-espacio">
            <label class="buzon-campo">Enviar para estudiantes a
              <select id="rutaEstudiante">
                <option value="responsable">Responsable principal</option>
                <option value="directo">Estudiante con autorización</option>
              </select>
            </label>
            <label class="buzon-campo">Buscar persona <input id="buscarPersona" type="search"></label>
          </div>
          <div class="buzon-linea buzon-espacio">
            <button id="marcarPersonas" type="button">Marcar personas visibles</button>
            <button id="limpiarPersonas" type="button">Limpiar selección</button>
          </div>
          <div id="personas" class="buzon-lista"></div>
          <p id="resumenPersonas" class="buzon-ayuda"></p>
        </section>

        <section class="buzon-seccion">
          <h2>Correo</h2>
          <div class="buzon-grid">
            <label class="buzon-campo">Asunto <input id="asunto" maxlength="150"></label>
            <label class="buzon-campo">Tipo de campaña
              <select id="tipoCampana">
                <option value="viaje">Información del viaje</option>
                <option value="descuento">Descuentos</option>
              </select>
            </label>
          </div>
          <label class="buzon-campo buzon-espacio">Mensaje
            <textarea id="cuerpo" rows="6" maxlength="6000"
              placeholder="Hola, {{nombre_destinatario}}."></textarea>
          </label>
          <p class="buzon-ayuda">Campos del correo: {{nombre_destinatario}} y {{lista_viajeros}}.</p>
          <div id="opcionesCodigo" class="buzon-grid" hidden>
            <label class="buzon-campo">Prefijo del código
              <input id="prefijo" value="RAI" maxlength="10">
            </label>
            <label class="buzon-campo">Caracteres aleatorios
              <input id="largo" type="number" min="8" max="16" value="10">
            </label>
          </div>
        </section>

        <section class="buzon-seccion">
          <h2>Imagen</h2>
          <div class="buzon-grid">
            <label class="buzon-campo">Imagen base opcional
              <input id="imagen" type="file" accept="image/png,image/jpeg,image/webp">
            </label>
            <label class="buzon-campo">Mostrar imagen
              <select id="modoImagen">
                <option value="adjunta">Como archivo adjunto</option>
                <option value="inline">Dentro del correo</option>
                <option value="ambas">Dentro del correo y como archivo</option>
              </select>
            </label>
          </div>
          <p id="infoImagen" class="buzon-ayuda"></p>
          <div id="capas"></div>
          <div class="buzon-linea buzon-espacio">
            <button id="agregarCapa" type="button">Agregar cuadro de texto</button>
            <button id="agregarCodigo" type="button" hidden>Agregar cuadro de código</button>
          </div>
          <label class="buzon-campo buzon-espacio">Viajero para la vista previa
            <select id="muestra"><option value="">Datos de ejemplo</option></select>
          </label>
          <div class="buzon-linea buzon-espacio">
            <button id="previsualizar" type="button">Previsualizar imagen</button>
            <button id="prueba" type="button">Enviar prueba a mi correo</button>
          </div>
          <img id="preview" class="buzon-vista" alt="Vista previa de la imagen del correo" hidden>
        </section>

        <section class="buzon-seccion">
          <h2>Envío e historial</h2>
          <div class="buzon-linea">
            <button id="enviar" type="button" class="buzon-principal">Iniciar campaña</button>
            <button id="actualizar" type="button">Actualizar historial</button>
          </div>
          <div id="historial" class="buzon-espacio"></div>
          <div id="detalle" class="buzon-lista"></div>
        </section>
      </div>
    </section>
  </main>

  <template id="plantillaCapa">
    <fieldset class="buzon-capa">
      <legend>Cuadro de texto</legend>
      <label class="buzon-campo">Texto
        <textarea data-k="texto" rows="3" maxlength="500"></textarea>
      </label>
      <div class="buzon-grid buzon-espacio">
        <label class="buzon-campo">Insertar campo
          <select data-insertar>
            <option value="">Elegir…</option>
            <option value="nombre_viajero">Nombre del viajero</option>
            <option value="nombre_destinatario">Nombre del destinatario</option>
            <option value="grupo">Grupo</option>
            <option value="destino">Destino</option>
            <option value="codigo">Código de descuento</option>
          </select>
        </label>
        <label class="buzon-campo">Posición
          <select data-posicion>
            <option value="">Personalizada</option>
            <option value="10,12,izquierda">Arriba a la izquierda</option>
            <option value="50,12,centro">Arriba al centro</option>
            <option value="90,12,derecha">Arriba a la derecha</option>
            <option value="10,50,izquierda">Al medio a la izquierda</option>
            <option value="50,50,centro">Centro</option>
            <option value="90,50,derecha">Al medio a la derecha</option>
            <option value="10,87,izquierda">Abajo a la izquierda</option>
            <option value="50,87,centro">Abajo al centro</option>
            <option value="90,87,derecha">Abajo a la derecha</option>
          </select>
        </label>
        <label class="buzon-campo">Horizontal %
          <input data-k="x" type="number" min="0" max="100" value="50">
        </label>
        <label class="buzon-campo">Vertical %
          <input data-k="y" type="number" min="0" max="100" value="50">
        </label>
        <label class="buzon-campo">Alineación
          <select data-k="alineacion">
            <option value="centro">Centro</option>
            <option value="izquierda">Izquierda</option>
            <option value="derecha">Derecha</option>
          </select>
        </label>
        <label class="buzon-campo">Tipografía
          <select data-k="fuente">
            <option value="sans">Sans serif</option>
            <option value="serif">Serif</option>
            <option value="mono">Monoespaciada</option>
          </select>
        </label>
        <label class="buzon-campo">Tamaño % del ancho
          <input data-k="tamano" type="number" min="1" max="20" step="0.1" value="4">
        </label>
        <label class="buzon-campo">Color
          <input data-k="color" type="color" value="#ffffff">
        </label>
      </div>
      <div class="buzon-linea buzon-espacio">
        <label><input data-k="negrita" type="checkbox" checked> Negrita</label>
        <label><input data-k="cursiva" type="checkbox"> Cursiva</label>
        <button type="button" data-quitar>Quitar cuadro</button>
      </div>
    </fieldset>
  </template>

  <script type="module" src="./layout.js"></script>
  <script type="module" src="./buzon-correo.js"></script>
</body>
</html>
